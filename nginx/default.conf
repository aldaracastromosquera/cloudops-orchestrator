# Configuración del servidor Nginx que actúa como proxy inverso, recibe peticiones HTTP (puerto 80) y las redirige al servicio app (Flask en 0.0.0.0:8000)
server {
    # Escucha en el puerto 80
    listen 80;
    # Nombre del servidor -> guion bajo = acepta cualquier host
    server_name _;


    # --------------------------------------------------------
    # Bloque principal de rutas: "/"
    # --------------------------------------------------------
    location / {
        # Reenvía todas las peticiones al contenedor app
        proxy_pass http://app:8000;
        # Ajusta las cabeceras para mantener la información del cliente y evitar pérdida de contexto
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # --------------------------------------------------------
    # Ruta de comprobación de salud: "/health"
    # --------------------------------------------------------
    location /health {
        # Redirige directamente al endpoint /health de la app
        proxy_pass http://app:8000/health;
    }


    # --------------------------------------------------------
    # Ruta de métricas Prometheus: "/metrics"
    # --------------------------------------------------------
    location /metrics {
        # Redirige al endpoint /metrics de la app
        proxy_pass http://app:8000/metrics;
    }
}