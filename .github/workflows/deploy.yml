# ------------------------------------------------------------
# Nombre del workflow que aparece en GitHub Actions
# ------------------------------------------------------------
name: CI/CD

# ------------------------------------------------------------
# Cuándo se ejecuta el workflow
# En este caso:
#   - Cada vez que se hace un push en la rama main
#   - Y también cuando se crea o actualiza un pull request
# ------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:

# ------------------------------------------------------------
# Definición de los trabajos
# Cada job es un conjunto de pasos que se ejecutan en un runner
# ------------------------------------------------------------
jobs:
  build_and_validate:
    # --------------------------------------------------------
    # El runner es el sistema donde GitHub ejecuta los comandos
    # --------------------------------------------------------
    runs-on: ubuntu-latest  # "ubuntu-latest" significa que usará una máquina Linux actualizada

    # --------------------------------------------------------
    # Permisos mínimos necesarios para leer contenido del repo
    # --------------------------------------------------------
    permissions:
      contents: read   

    # --------------------------------------------------------
    # Lista de pasos del job
    # Cada "step" es una acción o un comando que se ejecuta en orden
    # --------------------------------------------------------
    steps:
      # --------------------------------------------------------
      # Checkout: descarga repositorio en la máquina del runner
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Buildx: prepara el entorno para construir imágenes Docker.
      # Permite builds más avanzados (multi-plataforma, caché, etc.)
      # --------------------------------------------------------
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # # (opcional) listamos para depurar rutas visibles por el runner
      - name: List repo tree
        run: |
          pwd
          ls -la
          echo "--- app/ ---"
          ls -la app || true

      # Build con contexto RAÍZ y Dockerfile en app/
      - name: Build app image
        run: docker build -t cloudops-app:ci -f ./app/Dockerfile .




      # --------------------------------------------------------
      # Instalación de Terraform
      # - Usa la versión 1.9.5
      # - Permite validar que la infraestructura (IaC) no tiene errores
      # --------------------------------------------------------
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # --------------------------------------------------------
      # Validación de los archivos Terraform (Azure)
      # - terraform fmt: revisa el formato del código
      # - terraform validate: comprueba la sintaxis y coherencia
      # --------------------------------------------------------
      - name: Terraform fmt (Azure)
        if: ${{ hashFiles('terraform/azure/*.tf') != '' }}
        working-directory: terraform/azure
        run: terraform fmt -check

      - name: Terraform validate (Azure)
        if: ${{ hashFiles('terraform/azure/*.tf') != '' }}
        working-directory: terraform/azure
        run: |
          terraform init -backend=false
          terraform validate

  deploy:
    # --------------------------------------------------------
    # Segundo trabajo: despliegue en Azure
    # Se ejecuta solo si el job anterior (build_and_validate) fue exitoso
    # --------------------------------------------------------
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build_and_validate

    steps:
      # --------------------------------------------------------
      # Checkout: descarga el código del repositorio
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR=/opt/cloudops

            # 1) Git: marca el repo como "safe" o arregla ownership
            if [ -d "$APP_DIR/.git" ]; then
              git config --global --add safe.directory "$APP_DIR" || true
            fi
            # (mejor) si el repo debe pertenecer a tu usuario de despliegue:
            # sudo chown -R ${USER}:${USER} "$APP_DIR" || true

            cd "$APP_DIR"

            # 2) Trae cambios del repo (si despliegas desde git)
            # quita estas líneas si NO usas git pull para desplegar
            git fetch --all --prune || true
            git reset --hard origin/main || true

            # 3) Docker con sudo (evita el permiso denegado)
            # Quita el campo 'version:' del compose si sigue en tu YAML
            sudo docker compose pull
            sudo docker compose up -d --build --remove-orphans
            sudo docker system prune -f || true
