name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build_and_validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # suficiente para repos privados si solo validas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Docker (solo build local) ----
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        run: docker build -t cloudops-app:ci ./app

      # ---- Terraform (valida sin backend) ----
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # Valida AWS si existe
      - name: Terraform fmt (AWS)
        if: ${{ hashFiles('terraform/aws/*.tf') != '' }}
        working-directory: terraform/aws
        run: terraform fmt -check

      - name: Terraform validate (AWS)
        if: ${{ hashFiles('terraform/aws/*.tf') != '' }}
        working-directory: terraform/aws
        run: |
          terraform init -backend=false
          terraform validate

      # Valida Azure si existe
      - name: Terraform fmt (Azure)
        if: ${{ hashFiles('terraform/azure/*.tf') != '' }}
        working-directory: terraform/azure
        run: terraform fmt -check

      - name: Terraform validate (Azure)
        if: ${{ hashFiles('terraform/azure/*.tf') != '' }}
        working-directory: terraform/azure
        run: |
          terraform init -backend=false
          terraform validate
