# ------------------------------------------------------------
# Nombre del workflow que aparece en GitHub Actions
# ------------------------------------------------------------
name: CI

# ------------------------------------------------------------
# Cuándo se ejecuta el workflow
# En este caso:
#   - Cada vez que se hace un push en la rama main
#   - Y también cuando se crea o actualiza un pull request
# ------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:

# ------------------------------------------------------------
# Definición de los trabajos
# Cada job es un conjunto de pasos que se ejecutan en un runner
# ------------------------------------------------------------
jobs:
  build_and_validate:
    # --------------------------------------------------------
    # El runner es el sistema donde GitHub ejecuta los comandos
<<<<<<< HEAD
    # --------------------------------------------------------
    runs-on: ubuntu-latest  # "ubuntu-latest" significa que usará una máquina Linux actualizada

    # --------------------------------------------------------
    # Permisos mínimos necesarios para leer contenido del repo
    # --------------------------------------------------------
    permissions:
      contents: read   

    # --------------------------------------------------------
    # Lista de pasos del job
    # Cada "step" es una acción o un comando que se ejecuta en orden
    # --------------------------------------------------------
    steps:
      # Checkout: descarga repositorio en la máquina del runner
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Buildx: prepara el entorno para construir imágenes Docker.Permite builds más avanzados (multi-plataforma, caché, etc.)
      # --------------------------------------------------------
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Construcción de la imagen Docker de tu aplicación
      # - Se etiqueta como "cloudops-app:ci"
      # - Usa el Dockerfile ubicado en la carpeta ./app
      # Esto no sube nada, solo asegura que el Dockerfile funciona
      # --------------------------------------------------------
      - name: Build app image
        run: docker build -t cloudops-app:ci ./app

      # --------------------------------------------------------
      # Instalación de Terraform
      # - Usa la versión 1.9.5
      # - Sirve para validar que la infraestructura (IaC) no tiene errores
      # --------------------------------------------------------
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # --------------------------------------------------------
      # Validación de los archivos Terraform (Azure)
      # - Si existen archivos .tf en terraform/azure/, ejecuta formato y validación
      # - terraform fmt: revisa que el formato del código sea correcto
      # - terraform validate: verifica la sintaxis y consistencia
      # --------------------------------------------------------
      - name: Terraform fmt (Azure)
        if: ${{ hashFiles('terraform/azure/*.tf') != '' }}
        working-directory: terraform/azure
        run: terraform fmt -check

      - name: Terraform validate (Azure)
        if: ${{ hashFiles('terraform/azure/*.tf') != '' }}
        working-directory: terraform/azure
        run: |
          terraform init -backend=false
          terraform validate
