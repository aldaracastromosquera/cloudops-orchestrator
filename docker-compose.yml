version: "3.9"

services:
  db:
    image: postgres:16
    container_name: cloudops-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [app_net]

  app:
    build: ./app           # ← si tu Dockerfile está dentro de /app
    container_name: cloudops-app
    env_file: .env
    depends_on: [db]
    expose:
      - "8000"
    restart: unless-stopped
    networks: [app_net]

  nginx:
    image: nginx:stable
    container_name: cloudops-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    ports:
      - "80:80"
    restart: unless-stopped
    networks: [app_net]

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
