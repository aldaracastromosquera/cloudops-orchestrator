version: "3.9"

services:
  db:
    image: postgres:16
    container_name: cloudops-db
    environment:
      POSTGRES_USER: ${DB_USER:-cloudops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudops}
      POSTGRES_DB: ${DB_NAME:-cloudops}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_net]

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: cloudops-app
    env_file:
      - app/.env.example
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [app_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: cloudops-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    ports:
      - "80:80"
    networks: [app_net]

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
