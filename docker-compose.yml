services:
  db:
    image: postgres:16
    container_name: cloudops-db
    environment:
      POSTGRES_USER: ${DB_USER:-cloudops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudops}
      POSTGRES_DB: ${DB_NAME:-cloudops}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [app_net]

  app:
    build: .
    container_name: cloudops-app
    env_file: .env
    depends_on:
      - db
    expose:
      - "8000"
    restart: unless-stopped
    networks: [app_net]

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
